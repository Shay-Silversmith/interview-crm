<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>InterviewFlow</title>
    <meta name="description" content="AI-powered Job Search CRM &amp; Interview Preparation" />
    <meta name="theme-color" content="#0D1E3D" />

    <!-- Favicon. The .svg the old markup pointed at never existed, so browsers
         fell back to a default globe. The .ico carries 16/32/48/64 renditions of
         the monogram; the wordmark is dropped at these sizes on purpose. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS / Apple -->
    <meta name="apple-mobile-web-app-capable"          content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title"            content="InterviewFlow" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Apply the stored theme before first paint. React mounts too late to
         stop a white flash on a dark-theme reload, so this runs synchronously
         in <head>. Must stay in sync with src/theme/ThemeProvider.tsx (same
         storage key, same resolution rule). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('interviewflow_theme')
          var dark = stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage blocked — fall through to light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
